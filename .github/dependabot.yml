version: 2

updates:
  # `uv`, not `pip`: the pip ecosystem reads pyproject.toml but does not regenerate
  # uv.lock, so it would raise a PR that leaves the lock stale and `uv sync --locked`
  # failing in every CI job. The uv ecosystem updates both.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the tooling, which moves often and is not what the pack ships.
      dev:
        dependency-type: development
    commit-message:
      prefix: deps
      include: scope

  # setup-uv publishes no floating major tag past v7, so the workflow pins an exact
  # version and would otherwise go stale silently. This is what moves it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
