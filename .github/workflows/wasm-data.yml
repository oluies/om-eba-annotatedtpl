name: the page

# Manual, and it publishes. The tree is derived from the EBA's DPM database, which the
# EBA's legal notice permits reproducing "provided the source is acknowledged" - the
# acknowledgement is in NOTICE, in every manifest.json, and in the page's own footer.
# Manual rather than on push, because each release is a 200 MB download and several
# minutes, and publishing is a decision each time rather than a consequence of a commit.
on:
  workflow_dispatch:
    inputs:
      releases:
        description: "DPM releases to publish, space separated, newest last."
        required: false
        default: "4.2.1 4.3 4.4"
      drafts:
        description: "Which of them are draft technical packages. The page says so when one is picked. Empty when none are."
        required: false
        default: ""
      framework:
        description: "Also render a page per template of these frameworks, space separated, under /templates/. Empty skips it."
        required: false
        default: "COREP FINREP"
      templates_from:
        description: "Which release's DPM the template catalogue is read from. The pages themselves offer every published release."
        required: false
        # One release, and only to decide which templates exist. Which release a page
        # *answers* under is the reader's choice now - the page queries the parquet for
        # whichever one they pick - so this no longer fixes what a page says.
        default: "4.4"
      deploy:
        description: "Publish to Pages. Unticked builds the artefact and stops."
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the page and its data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # --group docs as well: the template pages are rendered here, and Quarto's Python
      # engine needs a kernel. `uv sync` alone leaves that group out, which is why it is
      # a group and not a dev dependency.
      - run: uv sync --locked --group docs
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: obs/package-lock.json

      # mdbtools reads the Access file the EBA ships; the download is ~200 MB per release
      # and the export takes minutes, which is why this is not part of CI.
      - name: Install mdbtools
        run: sudo apt-get update && sudo apt-get install -y mdbtools

      - name: Fetch each release and write its tree
        run: |
          for release in ${{ inputs.releases }}; do
            echo "::group::DPM $release"
            # Each release is generated from its own database: a later database's view of
            # an earlier release carries deactivations that release never had.
            uv run source/fetch_dpm2.py --release "$release"
            tag=$(echo "$release" | tr . _)
            db="source/dpm2/dpm2_$tag.duckdb"
            [ -f "$db" ] || db=source/dpm2/dpm2.duckdb
            draft=""
            case " ${{ inputs.drafts }} " in *" $release "*) draft="--draft" ;; esac
            uv run source/gen_wasm_data.py --db "$db" --out web/public/data --dpm-release "$release" $draft
            # The runner has less disk than the downloads want, so each release gives its
            # back once its tree is written.
            rm -rf source/dpm2/*.accdb source/dpm2/*.zip source/dpm2/csv*
            echo "::endgroup::"
          done
          cat web/public/data/releases.json

      # The databases are still here - the loop only gives back the downloads and the
      # CSV - so the template pages are rendered from one of them rather than fetched
      # again. Named rather than "the newest", so that a release which is still a draft
      # technical package - as 4.4 was until 2026-10-12 - cannot become the source of
      # pages that read like settled documentation without someone saying so.
      - name: Render a page per template
        if: ${{ inputs.framework != '' }}
        run: |
          # Observable builds every template page from one source file, and the queries
          # run in the reader's browser rather than at build - so this is seconds for
          # hundreds of pages, where rendering them as documents was twenty minutes. The
          # release selector works for the same reason: a different release is a
          # different URL the page asks for, not a different build.
          tag=$(echo "${{ inputs.templates_from }}" | tr . _)
          db="source/dpm2/dpm2_$tag.duckdb"
          [ -f "$db" ] || { echo "No $db - is ${{ inputs.templates_from }} in the releases list?"; exit 1; }
          # The regulation's own wording, which the pages read by URL like everything
          # else. Not release-scoped: a regulation has its own versions, and each row
          # carries the celex it came from.
          cp source/its_labels.csv source/its_instructions.csv source/its_label_changes.csv \
            web/public/data/
          cd obs && npm ci && cd ..
          DPM2_DB="$PWD/$db" OBS_FRAMEWORKS="${{ inputs.framework }}" obs/build.sh
          mkdir -p web/public/templates
          cp -r obs/dist/. web/public/templates/
          echo "$(find web/public/templates -name '*.html' | wc -l) template pages"

      - uses: VirtusLab/scala-cli-setup@v1.18.0
        with:
          jvm: temurin:21
          scala-cli-version: 1.18.0

      - name: Build the page
        run: cd web && ./build.sh --js-mode release

      - name: What is being published
        run: |
          du -sh web/public
          find web/public -maxdepth 2 -name manifest.json -exec sh -c 'echo "--- $1"; head -c 300 "$1"; echo' _ {} \;

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/public

  deploy:
    name: publish
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
