name: browser data

# Manual only, and it does not publish. The parquet tree is derived from the EBA's DPM
# database, and putting a derived copy on a public site is redistribution - that question
# is open, so this builds the artefact and stops. Turning it into a Pages deploy is a
# four-line change once the answer is yes.
on:
  workflow_dispatch:
    inputs:
      dpm_release:
        description: "Which DPM release to publish, e.g. 4.4. Empty means every release in the database."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build the parquet tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked

      # mdbtools reads the Access file the EBA ships; the download is ~200 MB and the
      # export takes a few minutes, which is why this is not part of CI.
      - name: Install mdbtools
        run: sudo apt-get update && sudo apt-get install -y mdbtools

      - name: Fetch the DPM
        run: uv run source/fetch_dpm2.py ${{ inputs.dpm_release && format('--release {0}', inputs.dpm_release) || '' }}

      # The rules change between releases and the EBA publishes the patches separately,
      # so a tree built from the release alone can claim a deactivated rule is live.
      # Left to a human for now: the batch to apply depends on the reporting date.
      - name: Build the tree
        run: |
          uv run source/gen_wasm_data.py \
            ${{ inputs.dpm_release && format('--dpm-release {0}', inputs.dpm_release) || '' }} \
            --out site/data
          cat site/data/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: dpm-parquet${{ inputs.dpm_release && format('-{0}', inputs.dpm_release) || '' }}
          path: site/data
          retention-days: 7
