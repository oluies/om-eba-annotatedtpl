[project]
name = "om-eba-annotatedtpl"
version = "0.1.0"
description = "EBA PAY 4.2 annotated table layout, normalised into OpenMetadata documentation"
requires-python = ">=3.12"
# Two kinds of floor, and the difference is deliberate. Where the code demonstrably needs
# a major version - the v2 API of pydantic and of pydantic-settings - the floor says so and
# nothing narrower. Everywhere else it is the version CI actually tests, which is a claim
# about what is known to work rather than a measured minimum: nobody has established that
# duckdb 1.4 fails, only that it has never been run. Lower one if you test one.
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "sqlfluff>=4.4.0",
    "ty>=0.0.85",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
# The pack's modules are at the root and the generators in source/; conftest.py puts both
# on sys.path at run time, and this is the same thing for the type checker.
extra-paths = [".", "source", "tests"]

[tool.ruff.lint.isort]
# The pack's modules sit at the repository root rather than in a package, so without this
# ruff sorts them in with httpx and duckdb and the import block stops saying anything.
known-first-party = [
    "agent_tools",
    "check_instance",
    "ba_form_cell",
    "conftest",
    "describe_table",
    "display_names",
    "dpm_lookup",
    "fetch_dpm2",
    "gen_dpm2_doc",
    "import_to_openmetadata",
    "load_to_mssql",
    "pay42_lookup",
]

[tool.pytest.ini_options]
# The pack's modules live at the repository root, not in a package, so the tests import
# them by name; conftest.py puts the root on sys.path.
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# conftest.py puts the repository root on sys.path, which has to happen before the modules
# that live there can be imported. The late imports are the point of the file.
"tests/conftest.py" = ["E402"]
# These two embed the generated Markdown as string literals. Wrapping those lines would
# wrap the output, and a Markdown table row cannot be wrapped at all, so the limit
# applies to the code around the prose rather than to the prose.
"source/gen_pack.py" = ["E501"]
"source/gen_dpm2_doc.py" = ["E501"]
