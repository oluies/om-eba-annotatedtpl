[project]
name = "om-eba-annotatedtpl"
version = "0.1.0"
description = "EBA PAY 4.2 annotated table layout, normalised into OpenMetadata documentation"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "httpx",
    "openpyxl",
    "pydantic>=2",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
# The pack's modules are at the root and the generators in source/; conftest.py puts both
# on sys.path at run time, and this is the same thing for the type checker.
extra-paths = [".", "source", "tests"]

[tool.ruff.lint.isort]
# The pack's modules sit at the repository root rather than in a package, so without this
# ruff sorts them in with httpx and duckdb and the import block stops saying anything.
known-first-party = [
    "agent_tools",
    "ba_form_cell",
    "conftest",
    "describe_table",
    "display_names",
    "dpm_lookup",
    "gen_dpm2_doc",
    "import_to_openmetadata",
    "pay42_lookup",
]

[tool.pytest.ini_options]
# The pack's modules live at the repository root, not in a package, so the tests import
# them by name; conftest.py puts the root on sys.path.
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# conftest.py puts the repository root on sys.path, which has to happen before the modules
# that live there can be imported. The late imports are the point of the file.
"tests/conftest.py" = ["E402"]
# gen_pack.py embeds the generated Markdown as string literals. Wrapping those lines
# would wrap the output, so the limit applies to the code around them, not to prose.
"source/gen_pack.py" = ["E501"]
