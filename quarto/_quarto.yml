project:
  type: website
  output-dir: _site

website:
  title: "EBA DPM, by template"
  description: "What one reporting template is, what it breaks down by, and what has changed."
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - href: index.qmd
        text: What this is
      - href: https://oluies.github.io/om-eba-annotatedtpl/
        text: Ask a question
      - href: https://github.com/oluies/om-eba-annotatedtpl
        text: Source
  page-footer:
    center: |
      Derived from the EBA DPM 2.0 database. Reproduction of EBA material is authorised
      provided the source is acknowledged (<https://www.eba.europa.eu/legal-notice>).
      Not published by the EBA and not endorsed by it.

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    code-tools: false
    anchor-sections: true
    # The "Other Formats" link points at the file the render wrote, and render.sh moves
    # that file to the template's own name afterwards, so the link would be to a page
    # that is not there. The markdown is for the catalogue, not for a reader here.
    format-links: false
    # Written by pages.py before each render: the links that change release. Empty when
    # only one release is being published, which is the usual case locally.
    include-before-body: _switcher.html
  # The second destination: one source, rendered as GitHub-flavoured markdown for a
  # catalogue that takes markdown and nothing else.
  gfm:
    toc: false

# Nothing here needs a kernel the reader has; the pages are rendered once, by us.
execute:
  echo: false
  warning: false
  freeze: false
  # Asked for, and it does not do what the name suggests here: the daemon keeps a kernel
  # alive between renders of the SAME file, so a project of 157 pages still starts 157
  # kernels and the log says so. Left on because it makes re-rendering one page while
  # editing it quick, which is the case it is for. The cost of a framework is kernel
  # startup, about 1.5s a page, and that is why this is a manual workflow.
  daemon: true
